# ==============================================================================
# Production Loki-Stack Helm Values (Loki + Promtail)
# ==============================================================================

loki:
  enabled: true
  isDefault: false
  image:
    tag: "2.9.3"
  persistence:
    enabled: false
  config:
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /tmp/loki
      storage:
        filesystem:
          chunks_directory: /tmp/loki/chunks
          rules_directory: /tmp/loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: boltdb-shipper
          object_store: filesystem
          schema: v11
          index:
            prefix: index_
            period: 24h
    limits_config:
      reject_old_samples: true
      reject_old_samples_max_age: 168h
      max_query_series: 500
      ingestion_rate_mb: 10
      ingestion_burst_size_mb: 20

# Promtail DaemonSet (Runs on every Worker Node)
promtail:
  enabled: true
  config:
    lokiAddress: http://loki.monitoring.svc.cluster.local:3100/loki/api/v1/push
    snippets:
      pipelineStages:
        # 1. Parse JSON logs from Nginx
        - json:
            expressions:
              timestamp: timestamp
              status: status
              request_method: request_method
              request_uri: request_uri
              request_time: request_time
              request_id: request_id
              trace_id: trace_id
        # 2. Extract labels for fast LogQL indexing
        - labels:
            status:
            request_method:
        # 3. Match 4xx & 5xx error spikes for alerting
        - match:
            selector: '{app="car-serv-app"} | json | status >= 400'
            stages:
              - metrics:
                  http_error_total:
                    type: Counter
                    description: "Total count of HTTP error responses"
                    source: status
                    config:
                      action: inc
