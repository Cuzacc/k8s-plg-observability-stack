# ==============================================================================
# Production Kube-Prometheus-Stack Helm Values
# ==============================================================================

# Disable default Grafana if using centralized instance or standalone chart
grafana:
  enabled: true
  adminPassword: "adminPasswordChangeMe123!"
  service:
    type: LoadBalancer
    port: 80
  persistence:
    enabled: false
  dashboardProviders:
    dashboardproviders.yaml:
      apiVersion: 1
      providers:
        - name: "default"
          orgId: 1
          folder: "Kubernetes Observability"
          type: file
          disableDeletion: false
          editable: true
          options:
            path: /var/lib/grafana/dashboards/default
  datasources:
    datasources.yaml:
      apiVersion: 1
      datasources:
        - name: Prometheus
          type: prometheus
          access: proxy
          url: http://prometheus-operated.monitoring.svc.cluster.local:9090
          isDefault: true
          editable: false
        - name: Loki
          type: loki
          access: proxy
          url: http://loki.monitoring.svc.cluster.local:3100
          isDefault: false
          editable: false

# Prometheus Core Server Configuration
prometheus:
  enabled: true
  prometheusSpec:
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    retention: 15d
    retentionSize: "10Gi"
    resources:
      requests:
        cpu: 250m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi
    storageSpec:
      emptyDir: {}

# Alertmanager Configuration
alertmanager:
  enabled: true
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi
  config:
    global:
      resolve_timeout: 5m
    route:
      group_by: ['alertname', 'namespace', 'job']
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 4h
      receiver: 'telegram-notifications'
      routes:
        - match:
            severity: critical
          receiver: 'telegram-notifications'
          continue: true
        - match:
            severity: warning
          receiver: 'telegram-notifications'
    receivers:
      - name: 'telegram-notifications'
        telegram_configs:
          - bot_token: 'REPLACE_WITH_TELEGRAM_BOT_TOKEN'
            chat_id: -1001234567890
            send_resolved: true
            parse_mode: 'HTML'
            message: |-
              {{ if eq .Status "firing" }}🔥 <b>[FIRING:{{ .Alerts.Firing | len }}] {{ .CommonLabels.alertname }}</b>{{ else }}✅ <b>[RESOLVED] {{ .CommonLabels.alertname }}</b>{{ end }}
              <b>Severity:</b> <code>{{ .CommonLabels.severity }}</code>
              <b>Namespace:</b> <code>{{ .CommonLabels.namespace }}</code>
              <b>Summary:</b> {{ .CommonAnnotations.summary }}
              <b>Description:</b> {{ .CommonAnnotations.description }}
              <b>Time:</b> {{ (index .Alerts 0).StartsAt.Format "2006-01-02 15:04:05" }}

# Component Exporters
nodeExporter:
  enabled: true

kubeStateMetrics:
  enabled: true
